# Real C projects used to measure how often cbuild builds a project with no help.
# Each one is pinned to a commit, so results stay comparable over time.
#
#   executables: programs the plan must contain (target names, case-insensitive)
#   library:     true if the project's main artifact is a library

# --- easy: small, one folder, no external dependencies ---------------------------

[[project]]
name = "kilo"
repo = "https://github.com/antirez/kilo"
rev = "323d93b29bd89a2cb446de90c4ed4fea1764176e"
difficulty = "easy"
executables = ["kilo"]

