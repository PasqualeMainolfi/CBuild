[package]
name = "cbuild"
version = "0.1.0"
edition = "2024"
description = "Build and run C projects without writing build files"
license = "MIT"
repository = "https://github.com/PasqualeMainolfi/CBuild"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
glob = "0.3.4"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
